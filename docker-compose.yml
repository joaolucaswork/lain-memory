# lain-memory data stack: Qdrant (vectors).
# Qdrant uses a repo-local bind mount (visible, rsync-able).
# Back up Qdrant via the snapshot API, not by copying the bind dir live.
# No Redis: caches are in-memory TTL (see src/lib/ttl-cache.ts).

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: lain-qdrant
    restart: unless-stopped
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      # Repo-local data dir (gitignored — vectors don't belong in git).
      # Survives container recreation. Back up via Qdrant snapshot API.
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/6333 && printf "GET /collections HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q "200"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
