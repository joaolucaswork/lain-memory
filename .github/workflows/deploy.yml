name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys em série (single-instance): nunca dois ao mesmo tempo.
concurrency:
  group: deploy-lain-memory
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, lain-memory]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test src/

  deploy:
    needs: verify
    runs-on: [self-hosted, lain-memory]
    steps:
      - run: /opt/deploy/lain-memory.sh
