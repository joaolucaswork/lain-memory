name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys em série (single-instance): nunca dois ao mesmo tempo.
concurrency:
  group: deploy-lain-memory
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, lain-memory]
    env:
      # Chave dummy: cobre o handshake MCP (sem backend) sem vazar segredo.
      LAIN_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Pina o toolchain: mesma versão do dev local (latest quebrou
          # prototype-patching em mem0-gateway.test no CI).
          bun-version: 1.3.14
      - run: bun install
      - run: bun run typecheck
      - run: bun test src/

  deploy:
    needs: verify
    runs-on: [self-hosted, lain-memory]
    steps:
      - run: /opt/deploy/lain-memory.sh
